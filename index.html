<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapar Limones</title>
  <!-- Fuente externa para un estilo más moderno y de videojuego -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="limones.css">
  <script src="utils.js"></script>
</head>
<body onload="iniciar();">
  <div class="contenedor">
    <header>
      <h1>🍋 Atrapar Limones 🍋</h1>
      <p class="subtitulo">Si del cielo te caen limones, aprende a hacer limonada</p>
      <p class="autor">Autor: Adrián Navarro</p>
    </header>

    <div class="game-wrapper">
      <div class="panel">
        <div class="stat-box">
          Puntaje: <span id="txtPuntaje" class="valor-puntaje">0</span>
        </div>
        <div class="stat-box">
          Vidas: <span id="txtVidas" class="valor-vidas">3</span>
        </div>
      </div>

      <canvas id="areaJuego" width="600" height="400"></canvas>
    </div>

    <div class="botones">
      <button class="btn-control" onclick="moverIzquierda()">◀ Izquierda</button>
      <button class="btn-control" onclick="moverDerecha()">Derecha ▶</button>
      <button class="btn-accion" onclick="reiniciar()">🔄 Reiniciar</button>
    </div>
  </div> 
  <script src="limones.js"></script>
</body>
</html>
